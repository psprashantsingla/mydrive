<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>MyDrive</title>
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <div class="brand big"><img src="/static/icon.svg" alt="" width="40" height="40"> MyDrive</div>
    <label>Username<input name="username" autocomplete="username" autocapitalize="none" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary wide" type="submit">Sign in</button>
    <p class="error" id="login-error"></p>
  </form>
</div>

<div id="app" class="layout" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="brand"><img src="/static/icon.svg" alt="" width="28" height="28"> MyDrive</div>
    <button class="btn primary new-btn" id="new-btn"><span class="plus">+</span> New</button>
    <nav id="nav">
      <a href="#/files/" data-view="files">My files</a>
      <a href="#/files/Shared" data-view="shared">Family shared</a>
      <a href="#/trash" data-view="trash">Trash</a>
      <a href="#/shares" data-view="shares">Share links</a>
      <a href="#/keys" data-view="keys">Apps &amp; Claude</a>
      <a href="#/account" data-view="account">Account</a>
      <a href="#/users" data-view="users" id="nav-users" hidden>Users</a>
    </nav>
    <div class="meter" id="meter"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
      <form id="search-form" class="search"><input id="search" type="search" placeholder="Search files" aria-label="Search files"></form>
      <div class="user"><span id="whoami"></span><button class="btn ghost" id="logout">Sign out</button></div>
    </header>
    <section id="view" class="view"></section>
  </div>
</div>

<div id="dropzone" class="dropzone" hidden><div>Drop files to upload</div></div>
<div id="uploads" class="uploads" hidden></div>
<div id="toasts" class="toasts"></div>
<dialog id="modal" class="modal"></dialog>
<div id="menu" class="popmenu" hidden></div>
<input type="file" id="file-input" multiple hidden>
<input type="file" id="folder-input" webkitdirectory multiple hidden>
</body>
</html>
